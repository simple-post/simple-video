name: Native credential stores
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Test Linux Secret Service in an isolated session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/simple-video-keyring-data"
          dbus-run-session -- bash -c 'printf "%s" "synthetic-ci-keyring-password" | gnome-keyring-daemon --unlock; node scripts/test-native-store.mjs'
      - name: Prepare isolated macOS test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          security create-keychain -p synthetic-ci-password "$RUNNER_TEMP/simple-video-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/simple-video-test.keychain-db"
          security unlock-keychain -p synthetic-ci-password "$RUNNER_TEMP/simple-video-test.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/simple-video-test.keychain-db"
      - name: Test macOS Keychain or Windows Credential Manager
        if: runner.os != 'Linux'
        run: node scripts/test-native-store.mjs
